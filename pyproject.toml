[project]
name = "reviewer-controls"
version = "0.0.1"
description = "Tests an AI code reviewer on every change by planting known bugs and checking whether it catches them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
reviewer-controls = "reviewer_controls.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
